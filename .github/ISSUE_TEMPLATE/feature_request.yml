name: Feature request
description: Something the tool should support that it doesn't
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, with a command or API sketch if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
  - type: dropdown
    id: help
    attributes:
      label: Would you open a PR for it?
      description: Big changes need a maintainer's go-ahead on this issue first.
      options:
        - "Yes, once the approach is agreed"
        - "Maybe, with some guidance"
        - "No"
    validations:
      required: true
