name: Bug report
description: A crash, an error, or output that is plainly wrong
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If the output only looks different from Roblox Studio, use the "Looks different from Studio" form instead.
        Security problems go to the private form on the Security tab, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, with flags. The smaller the example, the faster the fix.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or error
      description: Paste the full error. Remove cookies, tokens and anything personal first.
      render: text
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver (if it renders anything)
      placeholder: e.g. NVIDIA, driver 581.42
  - type: textarea
    id: files
    attributes:
      label: Files that reproduce it
      description: Attach a minimal .rbxm, .rbxmx or .luau you made yourself. Don't attach assets, models or places from games you don't own.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: Anything I attached is mine to share and contains no cookies, tokens or personal data.
          required: true
