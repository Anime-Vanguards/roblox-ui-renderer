# Runs on the public repository only: the private one has no free Actions minutes to spare.
# Third-party actions are pinned to full commit SHAs; Dependabot (private repo) keeps them current.
# GitHub's Windows runners have no GPU and no Roblox Studio: this builds rur-native and runs the checks
# that need neither (docs/testing.md lists the others).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      RUR_FREETYPE_SRC: ${{ github.workspace }}/.cache/native-app/source/freetype-2.14.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.90.0"
      # The runner image brings its own stable Rust, which this build never uses. rust-cache keys its
      # cache by every installed toolchain, so each image with a newer stable found no cache and
      # compiled everything (2026-11-19: 1.99.1 to 1.100.0, 17.8 instead of 5.5 minutes). Removing
      # the others leaves the pinned one in the key.
      - name: Remove the runner image's other Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $(rustup toolchain list --quiet | cut -d' ' -f1); do
            case "$toolchain" in
              1.90.0-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done
          rustup toolchain list
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install npm packages
        run: npm ci
      - name: Download FreeType
        run: node tools/native-app/build.mjs --prepare
      # text_studio, text_hinted and the TextBox editing test measure text with Studio's fonts; three
      # render tests draw with the GPU, and the runner has none (they crashed the test process).
      # native_snapped_image_pixels_match_canonical_canvas records a hardware GPU's answers at texel ties; its
      # geometry is checked here by render::image_records::tests::hardware_sampled_quads_submit_the_measured_geometry
      # (in --lib, not skipped): keep that one running when editing this list.
      #
      # This one cargo command also builds the library and rur-native (cargo builds a package's
      # binaries for its integration tests), so the library and its test binary compile side by side
      # instead of one after the other.
      - name: Rust tests
        working-directory: native
        run: cargo test --release --locked --lib --test image_math --test paint --test text_corpus -- --skip engine::input::tests::textbox_focus_caret_and_editing --skip render::gpu::tests::native_gpu_quad_alpha_texture_groups_and_clipped_glyph --skip render::gpu::tests::partial_redraws_match_whole_frames --skip render::image_records::tests::native_snapped_image_pixels_match_canonical_canvas
      # The plain release build of the default features. The test step built all of it already, so
      # this finds it fresh; it still builds whatever a failed test step left out.
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: native
        run: cargo build --release --locked
      # native-assets.mjs runs `rur-native assets`: the binary the step above built
      - name: Node checks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RUR_NATIVE_ENGINE: ${{ github.workspace }}/native/target/release/rur-native.exe
        run: |
          set -e
          for check in tools/tests/native-assets.mjs tools/tests/native-build-lock.mjs tools/tests/places.mjs \
            tools/tests/web-bundle-directories.mjs tools/tests/emulator-pin.mjs; do
            echo "== $check"
            node "$check"
          done
