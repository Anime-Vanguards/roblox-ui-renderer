# Prebuilt rur-native releases. A push to main that touches release files, or a manual run, is a
# dry run: it builds, tests and smoke-tests every platform and leaves the zips as workflow artifacts.
# A version tag publishes a GitHub release: the zips of the dry run that passed on main at the tagged
# commit when there is one (tools/release/dry-run.mjs; the release command tags only such a commit),
# so the same source is not built twice; otherwise the tag run does everything a dry run does first.
#
# Jobs: version (check the version), windows-build (the two Windows builds, one runner each),
# windows-validation (the Windows installed tests, on a fresh runner), build (Linux and macOS, one
# zip each), smoke (run each zip on a fresh runner), notes (release notes, tags only) and publish
# (tags only, the only job that can write).
# The workflow never creates or moves a tag: the tag is pushed to the private repository and
# mirrored here by the export.
name: Release

on:
  push:
    # Pushes to main with these paths are dry runs; path filters do not apply to tags
    branches: [main]
    # A tag of this form publishes
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - package.json
      - package-lock.json
      - native/Cargo.toml
      - native/Cargo.lock
      - native/.cargo/config.toml
      - native/build.rs
      - native/tests/standalone.rs
      - native/tests/support/**
      - tools/native-app/build.mjs
      - tools/native-host/**
      # The license and notice files the zip ships
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - licenses/**
  workflow_dispatch:

permissions:
  contents: read

# No release run is ever cancelled by another. Pushes to main share one group without cancelling: a
# dry run that has started always finishes (the release command may be waiting on it), and a newer
# push only replaces a dry run still waiting for it. A tag or a manual run is a group of its own.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read # to find the dry run of the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The dry run whose zips a tag publishes; empty when this run builds them
      dry-run: ${{ steps.dry-run.outputs.run-id }}
    steps:
      # Full history, for the check that a tag is on main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the version, and for a tag check it
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            # Fails unless every manifest holds the version and the tag is exactly v<version>
            VERSION=$(node tools/release/version.mjs --tag "$GITHUB_REF_NAME")
            # The tagged commit must be on main (merge-base fails if it is not)
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          else
            VERSION=$(node tools/release/version.mjs)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Release script self-checks
        run: node --test tools/release/test.mjs
      # A tag publishes the zips (and the FreeType source) of the passing dry run of the same
      # commit, which built, tested and smoke-tested every platform; the build and test jobs below
      # then have nothing to do. Without one they run.
      - name: Find the passing dry run of the tagged commit
        id: dry-run
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/dry-run.mjs --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --artifacts binary-windows-x86_64,binary-linux-x86_64,binary-macos-aarch64,freetype-source >> "$GITHUB_OUTPUT"

  # Windows takes about ten minutes per build, so the two builds each get their own runner instead
  # of running one after the other:
  #   dist   the binary that ships, marked as a release build. It is packaged and uploaded as the zip.
  #   tests  the unmarked build the installed tests compare it with, and the test program itself,
  #          both with the same dist profile as the shipped binary.
  # windows-validation then runs the installed tests on a fresh runner. Linux and macOS keep one
  # build job each: a second macOS job would only add another wait for a scarce macOS runner.
  windows-build:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [dist, tests]
    env:
      RELEASE_OS: windows
      RELEASE_ARCH: x86_64
      RELEASE_TARGET: x86_64-pc-windows-msvc
      EXE_SUFFIX: .exe
      # Windows links the C runtime in, so the binary needs no Visual C++ redistributable. The test
      # program that goes to the validation runner is linked the same way, so it needs none either.
      RUSTFLAGS: '-C target-feature=+crt-static'
      # Where `node tools/native-app/build.mjs --prepare` puts the downloaded FreeType source
      RUR_FREETYPE_SRC: ${{ github.workspace }}/.cache/native-app/source/freetype-2.14.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as ci.yml. No build cache here: a release starts clean, so nothing a
      # pull request's CI run saved can reach a release binary.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.90.0"
      - name: Download and verify FreeType
        run: node tools/native-app/build.mjs --prepare
      - name: Build this profile
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          # Only the dist build below sets the mark
          unset RUR_RELEASE_BUILD
          if [ "${{ matrix.profile }}" = dist ]; then
            # Marks the binary as a release build, so it uses standalone defaults and never the
            # checkout it was built in (native/src/paths.rs). Read at compile time. Only the shipped
            # binary is marked; its dist profile and the public default features are as ever.
            RUR_RELEASE_BUILD=1 cargo build --profile dist --locked --bin rur-native --target "$RELEASE_TARGET"
          else
            # Builds the unmarked rur-native the comparison tests start as the checkout binary, and
            # the standalone test program, without running anything. Cargo writes the absolute path
            # of that rur-native into the test program, so the program has to be run from where it
            # was built (see windows-validation). The dist profile, as the shipped binary: a clean
            # build of it is also faster here than one of the release profile, which is incremental.
            cargo test --profile dist --locked --test standalone --target "$RELEASE_TARGET" --no-run
          fi
      # The parser inventory (path_contract) is an ordinary test, which the --ignored run in
      # windows-validation does not include. It runs here, with the cargo command Linux and macOS
      # use, because it needs what this runner already has: Cargo and, through `cargo metadata`,
      # the pinned engine's sources. A new path option, positional input or request field fails
      # the release build until the path check covers it. The build step has built everything this
      # command needs, so it compiles nothing and runs the test program that is uploaded below.
      - name: Parser inventory
        if: matrix.profile == 'tests'
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          # Nothing here may mark the comparison binary
          unset RUR_RELEASE_BUILD
          cargo test --profile dist --locked --test standalone --target "$RELEASE_TARGET" path_contract::
      # The test program is named standalone-<hash>.exe and the hash is not known here, so the
      # pattern must match exactly one file. The program has the path of this checkout compiled
      # in (CARGO_MANIFEST_DIR), so record that path for windows-validation to compare.
      - name: Check the harness and record its workspace
        if: matrix.profile == 'tests'
        shell: bash
        run: |
          set -euo pipefail
          TEST_BINARIES=(native/target/x86_64-pc-windows-msvc/dist/deps/standalone-*.exe)
          [ "${#TEST_BINARIES[@]}" = 1 ]
          [ -f "${TEST_BINARIES[0]}" ]
          node -e "require('node:fs').writeFileSync(
            'native/target/x86_64-pc-windows-msvc/dist/workspace.txt',
            require('node:fs').realpathSync('.')
          )"
      # The validation runner needs only these three files from this job: the unmarked comparison
      # binary, the test program and the recorded path. They are stored relative to the dist
      # folder and the validation job downloads them back into the same folder, so each lands at
      # the path Cargo compiled into the test program. deps/ stays in the pattern for that reason.
      # It keeps the default retention, so re-running only the failed jobs of a run days later still
      # finds it.
      - name: Upload the unmarked comparison binary and standalone harness
        if: matrix.profile == 'tests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-binaries
          path: |
            native/target/x86_64-pc-windows-msvc/dist/rur-native.exe
            native/target/x86_64-pc-windows-msvc/dist/deps/standalone-*.exe
            native/target/x86_64-pc-windows-msvc/dist/workspace.txt
          if-no-files-found: error
      - name: Generate licenses and package
        if: matrix.profile == 'dist'
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/licenses.mjs --target "$RELEASE_TARGET" --out release/THIRD_PARTY_LICENSES.txt --freetype "$RUR_FREETYPE_SRC"
          node tools/release/package.mjs --binary "native/target/$RELEASE_TARGET/dist/rur-native$EXE_SUFFIX" --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --licenses release/THIRD_PARTY_LICENSES.txt --out release --commit "$GITHUB_SHA"
      - name: Upload the zip
        if: matrix.profile == 'dist'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-windows-x86_64
          path: release/*.zip
          if-no-files-found: error
      # The release carries the exact FreeType source the binaries were built with (the GPL's
      # Corresponding Source). One copy is enough: every platform downloads the same checked archive.
      - name: Preserve the exact FreeType source archive used by the build
        if: matrix.profile == 'dist'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freetype-source
          path: .cache/native-app/source/freetype-2.14.2.tar.gz
          if-no-files-found: error

  # The Windows installed tests, on a fresh runner. They run against the rur-native.exe inside the
  # zip that smoke tests and publish ships, not against the build job's own output. Nothing is
  # compiled here: the unmarked binary and the test program come from windows-build.
  windows-validation:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' }}
    needs: [version, windows-build]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The marked binary the installed tests run, the one extracted from the zip below
      RUR_TEST_STANDALONE_BINARY: ${{ github.workspace }}/installed/rur-native.exe
    steps:
      # Besides the files downloaded below, the installed tests need only this checkout. They name
      # it as the checkout an installed binary must not take as its own. One test starts its asset
      # helper (cli/native-assets.mjs) with the runner's Node; another starts Node on a stub helper
      # it writes to the temp folder.
      # No Rust toolchain is installed: none of these tests runs Cargo. The tests that do, the
      # parser inventory, ran in windows-build.
      # No npm packages are installed: what these tests ask of the helper takes Node's standard
      # library only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Puts the comparison binary, the test program and workspace.txt back at the paths the build
      # runner had them at, inside the checkout's native/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-validation-binaries
          path: native/target/x86_64-pc-windows-msvc/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-windows-x86_64
          path: archives
      - name: Extract the binary from the zip that will be published
        shell: pwsh
        run: Expand-Archive -LiteralPath "archives/rur-native-$env:VERSION-windows-x86_64.zip" -DestinationPath installed
      - name: Installed release validation against the packaged binary
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          # Nothing here may mark the comparison binary
          unset RUR_RELEASE_BUILD
          # The test program has two absolute paths compiled in: this checkout (CARGO_MANIFEST_DIR)
          # and the comparison binary (CARGO_BIN_EXE_rur-native). Hosted runners of this OS use the
          # same workspace path in every job, so the downloaded files are where it expects them.
          # If that ever changes, this check fails the job rather than let the tests run against
          # another path.
          node -e "
            const fs = require('node:fs');
            require('node:assert/strict').equal(
              fs.readFileSync('target/x86_64-pc-windows-msvc/dist/workspace.txt', 'utf8'),
              fs.realpathSync('..')
            )
          "
          # Exactly one test program must have arrived; a missing or doubled one fails the job
          TEST_BINARIES=(target/x86_64-pc-windows-msvc/dist/deps/standalone-*.exe)
          [ "${#TEST_BINARIES[@]}" = 1 ]
          [ -f "${TEST_BINARIES[0]}" ]
          # --ignored runs only the ignored tests, which are the installed_* ones: the tests the
          # Linux and macOS build job runs with `cargo test -- --ignored`, here started without
          # cargo. Windows runners have no GPU, so the same five tests are skipped as ever: four
          # capture headless, and the fifth is a sequence, which creates a GPU device even when
          # PNG output is disabled. The smoke job still checks scene export there; the project
          # comparisons and render-service place checks run on every platform. The comparison
          # tests' own checks reject a marked comparison binary.
          "${TEST_BINARIES[0]}" --ignored \
            --skip installed_headless_uses_the_selected_project_for_local_images \
            --skip installed_saved_frames_stay_inside_the_named_output \
            --skip installed_default_captures_and_batch_summaries_stay_in_state \
            --skip installed_headless_selects_its_place_through_a_linked_root \
            --skip installed_service_standbys_keep_the_selected_place_for_sequence

  # Linux and macOS build the marked binary and package it, then build the unmarked one and the test
  # program, and run the installed tests against the binary in the zip, in one job each
  build:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # os and arch are the words in the zip's name (rur-native-<version>-<os>-<arch>.zip)
          # The oldest Ubuntu runner, for the lowest glibc the binary asks for
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, suffix: '' }
          - { runner: macos-15, os: macos, arch: aarch64, target: aarch64-apple-darwin, suffix: '' }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.target }}
      EXE_SUFFIX: ${{ matrix.suffix }}
      # Set but empty, as these platforms have always built: only Windows adds a compiler flag
      RUSTFLAGS: ''
      # Where `node tools/native-app/build.mjs --prepare` puts the downloaded FreeType source
      RUR_FREETYPE_SRC: ${{ github.workspace }}/.cache/native-app/source/freetype-2.14.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as ci.yml. No build cache here: a release starts clean, so nothing a
      # pull request's CI run saved can reach a release binary.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.90.0"
      # Build tools only; none of these packages ship in the zip. mesa-vulkan-drivers is the software
      # Vulkan the installed release tests need to draw a PNG, because the runner has no GPU.
      - name: Linux desktop build libraries and software Vulkan for release tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev mesa-vulkan-drivers
      - name: Install npm packages
        run: npm ci
      - name: Download and verify FreeType
        run: node tools/native-app/build.mjs --prepare
      - name: Build public default features from a clean target
        working-directory: native
        shell: bash
        env:
          # Marks the binary as a release build, so it uses standalone defaults and never the
          # checkout it was built in (native/src/paths.rs). Read at compile time.
          RUR_RELEASE_BUILD: '1'
        run: cargo build --profile dist --locked --bin rur-native --target "$RELEASE_TARGET"
      # Packaged right after the build: the test build below writes an unmarked rur-native over
      # the marked one in target/.
      - name: Generate licenses and package
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/licenses.mjs --target "$RELEASE_TARGET" --out release/THIRD_PARTY_LICENSES.txt --freetype "$RUR_FREETYPE_SRC"
          node tools/release/package.mjs --binary "native/target/$RELEASE_TARGET/dist/rur-native$EXE_SUFFIX" --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --licenses release/THIRD_PARTY_LICENSES.txt --out release --commit "$GITHUB_SHA"
      # The installed tests run against the binary in the zip that smoke tests and publish ships,
      # as on Windows. unzip keeps the Unix mode the package step stored.
      - name: Extract the binary from the zip that will be published
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "release/rur-native-$VERSION-$RELEASE_OS-$RELEASE_ARCH.zip" -d installed
          test -x "installed/rur-native$EXE_SUFFIX"
      # The `installed_*` tests in native/tests/standalone.rs are ignored in ordinary `cargo test`
      # runs because they need a binary built with RUR_RELEASE_BUILD=1. This is where they run:
      # against the marked binary from the zip.
      - name: Installed release validation against the packaged binary
        working-directory: native
        shell: bash
        env:
          RUR_TEST_STANDALONE_BINARY: ${{ github.workspace }}/installed/rur-native${{ matrix.suffix }}
        run: |
          set -euo pipefail
          # The project comparison tests also run a checkout binary, which cargo builds for the tests.
          # It has to be unmarked: if it were marked, both binaries would be standalone and the
          # comparison would prove nothing. It is built with the dist profile too, so of the whole
          # build only rur-native itself compiles again (the mark is read at compile time).
          unset RUR_RELEASE_BUILD
          # The parser inventory is an ordinary test, which the --ignored run below does not
          # include. Run it here so that a new path option, positional input or request field fails
          # the release build until the path check covers it.
          cargo test --profile dist --locked --test standalone --target "$RELEASE_TARGET" path_contract::
          # --ignored runs only the ignored tests, which are the installed_* ones
          cargo test --profile dist --locked --test standalone --target "$RELEASE_TARGET" -- --ignored
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error

  smoke:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' }}
    # windows-validation: the Windows zip is smoke-tested only after its installed tests passed
    needs: [version, build, windows-validation]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # png: whether the story is drawn on the GPU or only exported.
          # Windows runners have no GPU, so there the story runs through layout, scene, glyph and
          # image export with --no-png. Linux uses software Vulkan; macOS uses the runner's Metal device.
          # No runner has Roblox Studio, so Studio's fonts and textures are not checked anywhere.
          - { runner: windows-latest, os: windows, arch: x86_64, png: 'false' }
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, png: 'true' }
          - { runner: macos-15, os: macos, arch: aarch64, png: 'true' }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      SMOKE_PNG: ${{ matrix.png }}
    steps:
      # Only for the smoke script and the example project it renders. The checkout goes into a
      # subfolder and the script extracts the zip into a temporary folder outside it, so the binary
      # never runs inside a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: archives
      - name: Linux software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Installed binary smoke test outside the checkout
        shell: bash
        run: node inputs/tools/release/smoke.mjs --zip "archives/rur-native-$VERSION-$RELEASE_OS-$RELEASE_ARCH.zip" --version "$VERSION" --png "$SMOKE_PNG"

  notes:
    if: ${{ !github.event.repository.private && github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: version
    runs-on: ubuntu-22.04
    steps:
      # Full history, for the commit subjects since the previous release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Public commit subjects and installation instructions
        run: node tools/release/notes.mjs --tag "$GITHUB_REF_NAME" --out release-notes.md
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # Runs after this run's builds, tests and smoke tests passed, or, when they were skipped, on the
  # dry run's zips and FreeType source.
  publish:
    if: ${{ !cancelled() && !github.event.repository.private && github.event_name == 'push' && github.ref_type == 'tag' && needs.version.result == 'success' && needs.notes.result == 'success' && (needs.version.outputs.dry-run != '' || (needs.build.result == 'success' && needs.windows-validation.result == 'success' && needs.smoke.result == 'success')) }}
    needs: [version, build, windows-validation, smoke, notes]
    runs-on: ubuntu-22.04
    # The only job that can write
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # to download the dry run's artifacts
    steps:
      # No checkout, repository scripts, or build tools in this job: it only handles the artifacts
      # the earlier jobs (or the dry run's) made.
      - name: Say which run built the zips
        env:
          DRY_RUN: ${{ needs.version.outputs.dry-run }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            echo "Publishing the zips that dry run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN built and tested at $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing the zips this run built and tested" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the zips
        if: ${{ needs.version.outputs.dry-run == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets
      - name: Download the FreeType source archive
        if: ${{ needs.version.outputs.dry-run == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freetype-source
          path: assets
      - name: Download the zips the dry run of this commit built and tested
        if: ${{ needs.version.outputs.dry-run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets
          run-id: ${{ needs.version.outputs.dry-run }}
          github-token: ${{ github.token }}
      - name: Download the dry run's FreeType source archive
        if: ${{ needs.version.outputs.dry-run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freetype-source
          path: assets
          run-id: ${{ needs.version.outputs.dry-run }}
          github-token: ${{ github.token }}
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Hash every release asset
        working-directory: assets
        run: sha256sum -- *.zip *.tar.gz > ../SHA256SUMS
      - name: Attest build provenance of the zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.zip
      # --verify-tag: the tag must already exist. This never creates or moves one.
      - name: Publish the release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "rur-native $TAG" --notes-file notes/release-notes.md -R "$GITHUB_REPOSITORY" assets/*.zip assets/*.tar.gz SHA256SUMS
