<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUR Web Story</title>
<style>
	/* The plain page of a story bundle (tools/web/bundle.mjs): the story at one frame pixel per device
	   pixel, its input, and frame timings. ?manual: no frame loop (tools/web/frame-identity.mjs drives it) */
	:root { --bg: #1e1f22; --fg: #d4d6db; --muted: #8b8f98; color-scheme: dark; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
	header { padding: 8px 12px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
	#stats { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
	main { padding: 0 12px 12px; overflow: auto; }
	canvas { display: block; touch-action: none; outline: none; }
</style>
</head>
<body>
<header><select id="story" hidden></select><span id="status">Loading</span><span id="stats"></span></header>
<main><canvas id="canvas" tabindex="0"></canvas></main>
<script src="rur-host.js"></script>
<script>
"use strict";
(async () => {
	const $ = id => document.getElementById(id);
	const canvas = $("canvas");
	const params = new URLSearchParams(location.search);
	const log = text => ($("status").textContent = text);
	window.rur = { frames: [] };
	try {
		const started = performance.now();
		const host = await RurHost.load({ canvas, onStatus: (text, fraction) => log(`${text} ${Math.round(fraction * 100)}%`) });
		window.rur.host = host;
		window.rur.loadMs = performance.now() - started;
		const size = () => {
			canvas.style.width = `${canvas.width / devicePixelRatio}px`;
			canvas.style.height = `${canvas.height / devicePixelRatio}px`;
		};
		const mount = index => {
			const ready = host.mount(index, { firstDraw: !params.has("manual") });
			size();
			window.rur.ready = ready;
			log(`${host.story.path}: ${ready.nodes} nodes, ${ready.adapter}; mounted in ${ready.timings.totalMs.toFixed(0)} ms (load ${window.rur.loadMs.toFixed(0)} ms)`);
			return ready;
		};
		if (host.stories.length > 1) {
			const select = $("story");
			host.stories.forEach((story, index) => select.append(new Option(story.name, index)));
			select.hidden = false;
			select.addEventListener("change", () => mount(Number(select.value)));
		}
		mount(Number(params.get("story") || 0));
		if (params.has("manual")) {
			window.rur.state = "ready";
			return;
		}
		const logical = event => {
			const rect = canvas.getBoundingClientRect();
			const { width, height } = host.ready.viewport;
			return { x: (event.clientX - rect.left) / rect.width * width, y: (event.clientY - rect.top) / rect.height * height };
		};
		canvas.addEventListener("pointermove", event => host.queue({ type: "move", ...logical(event) }));
		canvas.addEventListener("pointerdown", event => {
			canvas.focus();
			try { canvas.setPointerCapture(event.pointerId); } catch {}
			host.queue({ type: "down", button: event.button === 2 ? 2 : event.button === 1 ? 3 : 1, ...logical(event) });
		});
		canvas.addEventListener("pointerup", event => host.queue({ type: "up", button: event.button === 2 ? 2 : event.button === 1 ? 3 : 1, ...logical(event) }));
		canvas.addEventListener("pointerleave", () => host.queue({ type: "leave" }));
		canvas.addEventListener("contextmenu", event => event.preventDefault());
		canvas.addEventListener("wheel", event => {
			event.preventDefault();
			const notches = RurHost.wheelNotches(event, host.ready.viewport.height);
			if (notches) host.queue({ type: "wheel", ...logical(event), dx: event.deltaX, dy: event.deltaY, notches });
		}, { passive: false });
		canvas.addEventListener("keydown", event => {
			RurHost.keyEvents(event, true).forEach(e => host.queue(e));
			event.preventDefault();
		});
		canvas.addEventListener("keyup", event => RurHost.keyEvents(event, false).forEach(e => host.queue(e)));
		const recent = [];
		host.start(stats => {
			if (stats.error) return log(`Frame failed: ${stats.error.message}`);
			window.rur.frames.push(stats);
			if (window.rur.frames.length > 2000) window.rur.frames.shift();
			recent.push(stats.wallMs);
			if (recent.length > 120) recent.shift();
			const sorted = [...recent].sort((a, b) => a - b);
			$("stats").textContent = `frame ${stats.wallMs.toFixed(1)} ms (engine ${stats.engineMs.toFixed(1)}, draw ${stats.drawMs.toFixed(1)}${stats.drawn ? "" : ", unchanged"}) | p50 ${sorted[sorted.length >> 1].toFixed(1)} ms, max ${sorted[sorted.length - 1].toFixed(1)} ms`;
		});
		window.rur.state = "running";
	} catch (error) {
		log(`Failed: ${error.message}`);
		window.rur.state = "failed";
		window.rur.error = String(error && error.stack || error);
		console.error(error);
	}
})();
</script>
</body>
</html>
